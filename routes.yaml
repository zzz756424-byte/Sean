# ============================================================
# FlightSeeker 搜尋設定
# 直接在 GitHub 網頁或手機 App 編輯這個檔案、存檔即可，
# 下一次排程執行就會套用新設定。
# ============================================================

settings:
  currency: TWD            # 幣別
  adults: 1                # 成人人數（價格與行李估算都會乘上人數）
  queries_per_run: 100     # 每次執行最多查幾組「日期 × 機場」組合，太多容易被 Google 擋
                           # 名額依各航線的 weight 分配（沒寫 = 1）
  delay_seconds: [1.5, 2.5] # 每次查詢之間隨機等待的秒數範圍
  notify_drop: 500         # 已通知過的組合，要再便宜這麼多（元）才會再通知一次
  test_force_deals: false # true = 每筆成功查價都加入測試通知
  
  # 自動低價線（航線設 auto_alert: true 才會用）：
  # 每個「出發→目的地」各自取最近 auto_alert_days 天查到價格的第 auto_alert_percentile 百分位，
  # 低於這條線就通知。例如 10 = 比過去 90% 的價格便宜。
  auto_alert_percentile: 0
  auto_alert_days: 30
  auto_alert_min_samples: 20   # 紀錄少於這個數量時，先用該航線的 alert_below

  # 未含托運行李的航空公司（名稱關鍵字，不分大小寫）。
  # 命中的航班會在票價上加 bag_estimate；其他航空公司視為已含行李。
  budget_airlines:
    - Peach
    - Tigerair
    - Jetstar
    - Scoot
    - Thai Lion Air
    - Hong Kong Express
    - ZIPAIR
    - AirAsia
    - T'way
    - Jeju Air
    - Jin Air
    - Air Busan
    - Eastar
    - Spring
    - VietJet
    - Cebu Pacific
    - HK Express
    
hotels:
  - name: 台北君悅酒店
    enabled: false  
    search_name: Grand Hyatt Taipei
    notify_drop: null # 追平或低於近 30 天最低價就通知；填正整數可設定最低降幅
    hotels_com_tw_url: https://tw.hotels.com/ho120725/tai-bei-jun-yue-jiu-dian-tai-bei-tai-wan/
    providers: # 留空 [] 顯示全部平台
      - Agoda
      - Booking.com
      - Trip.com
      - Hotels.com
      - ezTravel
    # property_token: 飯店的 SerpApi token
    check_in: 2026-12-04
    check_out: 2026-12-06
    adults: 2
    top: 3

routes:
  - name: 台中/台北 → 首爾
    enabled: false               
    origins: [RMQ, TPE]          # 出發機場（可多個）
    destinations: [ICN]     # 目的地機場（可多個）
    # 抵達時段使用各段抵達機場當地時間，[最早小時, 最晚小時]，0–23，留空不限
    outbound_arrival_hours: [8, 17]  # 去程抵達
    return_arrival_hours: [12, 22]    # 回程抵達
    window: [2027-03-20, 2027-03-27]  # 整趟旅程（去＋回）都要落在這段期間
    trip_days: [7, 8]               # 旅程天數（含去回當天），例如 [6, 7] 會兩種都查
    require_full_weekend: false   # 旅程必須完整包含一個週六＋週日
    max_stops: 0              # 最多轉機次數：0 = 只要直飛，null = 不限
    bag_estimate: 2000           # 廉航來回加購托運行李的估算（每人，元）
    alert_below: 20000           # 估算總價（含行李）低於這個金額就發通知
    auto_alert: true             # 是否依各「出發→目的地」歷史價格計算低價門檻
    
  - name: 台中/台北 → 沖繩
    enabled: true               
    origins: [RMQ]          # 出發機場（可多個）
    destinations: [OKA]     # 目的地機場（可多個）
    # 抵達時段使用各段抵達機場當地時間，[最早小時, 最晚小時]，0–23，留空不限
    outbound_arrival_hours: [8, 17]  # 去程抵達
    return_arrival_hours: [12, 22]    # 回程抵達
    window: [2027-03-20, 2027-03-27]  # 整趟旅程（去＋回）都要落在這段期間
    trip_days: [7, 8]               # 旅程天數（含去回當天），例如 [6, 7] 會兩種都查
    require_full_weekend: false   # 旅程必須完整包含一個週六＋週日
    max_stops: 0              # 最多轉機次數：0 = 只要直飛，null = 不限
    bag_estimate: 2000           # 廉航來回加購托運行李的估算（每人，元）
    alert_below: 20000           # 估算總價（含行李）低於這個金額就發通知
    auto_alert: true             # 是否依各「出發→目的地」歷史價格計算低價門檻

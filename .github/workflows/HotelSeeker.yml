name: HotelSeeker

on:
  schedule:
    - cron: "0 8,20 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      test_line:
        description: "只傳送一則 LINE 測試訊息"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: hotel-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ !inputs.test_line }}
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.test_line }}
        with:
          path: data/hotel_history.json
          key: hotel-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hotel-history-
      - name: Search hotel prices
        if: ${{ !inputs.test_line }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          HOTEL_ALERTS_FILE: ${{ runner.temp }}/hotel-alerts.md
          HOTEL_LINE_ALERTS_FILE: ${{ runner.temp }}/hotel-line-alerts.txt
        run: python -m flightseeker.hotels
      - name: Notify hotel price drops
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOTEL_ALERTS_FILE: ${{ runner.temp }}/hotel-alerts.md
        run: |
          if [[ -s "$HOTEL_ALERTS_FILE" ]]; then
            { cat "$HOTEL_ALERTS_FILE"; printf '\ncc @%s\n' "$GITHUB_REPOSITORY_OWNER"; } |
              gh issue create --title "飯店降價通知" --body-file -
          fi
      - name: Push hotel price drops to LINE
        if: ${{ !cancelled() }}
        env:
          LINE_ALERTS_FILE: ${{ runner.temp }}/hotel-line-alerts.txt
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_TEST: ${{ inputs.test_line }}
        run: python -m flightseeker.line_push
      - uses: actions/cache/save@v4
        if: always() && !inputs.test_line && hashFiles('data/hotel_history.json') != ''
        with:
          path: data/hotel_history.json
          key: hotel-history-${{ github.run_id }}-${{ github.run_attempt }}

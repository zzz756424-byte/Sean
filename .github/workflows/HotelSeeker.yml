name: HotelSeeker

on:
  schedule:
    - cron: "0 8,20 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hotel-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/hotel_history.json
          key: hotel-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hotel-history-
      - name: Search hotel prices
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          HOTEL_ALERTS_FILE: ${{ runner.temp }}/hotel-alerts.md
          HOTEL_LINE_ALERTS_FILE: ${{ runner.temp }}/hotel-line-alerts.txt
        run: python -m flightseeker.hotels
      - name: Notify hotel price drops
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOTEL_ALERTS_FILE: ${{ runner.temp }}/hotel-alerts.md
        run: |
          if [[ -s "$HOTEL_ALERTS_FILE" ]]; then
            { cat "$HOTEL_ALERTS_FILE"; printf '\ncc @%s\n' "$GITHUB_REPOSITORY_OWNER"; } |
              gh issue create --title "飯店降價通知" --body-file -
          fi
      - name: Push hotel price drops to LINE
        if: ${{ !cancelled() }}
        env:
          HOTEL_LINE_ALERTS_FILE: ${{ runner.temp }}/hotel-line-alerts.txt
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          path = Path(os.environ["HOTEL_LINE_ALERTS_FILE"])
          if not path.is_file():
              raise SystemExit(0)
          alerts = path.read_text(encoding="utf-8").strip()
          if not alerts:
              raise SystemExit(0)

          token = os.environ["LINE_CHANNEL_ACCESS_TOKEN"].strip()
          user_id = os.environ["LINE_USER_ID"].strip()
          if not token or not user_id:
              raise SystemExit("請設定 LINE_CHANNEL_ACCESS_TOKEN 和 LINE_USER_ID")

          message = alerts
          if len(message.encode("utf-16-le")) > 10000:
              suffix = "\n…其餘報價請查看執行摘要"
              budget = 10000 - len(suffix.encode("utf-16-le"))
              alerts = alerts.encode("utf-16-le")[:budget].decode("utf-16-le", errors="ignore")
              message = alerts + suffix
          payload = {"to": user_id, "messages": [{"type": "text", "text": message}]}
          request = Request(
              "https://api.line.me/v2/bot/message/push",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=30):
                  print("LINE 已接受飯店降價推播")
          except HTTPError as exc:
              raise SystemExit(f"LINE 推播失敗（HTTP {exc.code}）") from None
          except (URLError, TimeoutError):
              raise SystemExit("LINE 推播連線失敗") from None
          PY
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/hotel_history.json') != ''
        with:
          path: data/hotel_history.json
          key: hotel-history-${{ github.run_id }}-${{ github.run_attempt }}

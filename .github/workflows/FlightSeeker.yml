name: FlightSeeker

on:
  schedule:
    - cron: "0 8,12,16,20 * * *"
      timezone: "Asia/Taipei"
  push:
    # 修改搜尋條件或程式後立刻跑一次
    branches: [main]
    paths:
      - routes.yaml
      - requirements.txt
      - "flightseeker/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      test_force_deals:
        description: "測試通知（將本次成功查價的組合加入通知）"
        type: boolean
        default: false
      limit:
        description: "本次最多查幾組（留空 = 用 routes.yaml 的 queries_per_run）"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: flightseeker
  cancel-in-progress: false

jobs:
  seek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要完整 git 紀錄，才查得到 routes.yaml 的修改時間（搜尋條件版本）

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Search flights
        id: search
        env:
          QUERY_LIMIT: ${{ inputs.limit }}
          TEST_FORCE_DEALS: ${{ inputs.test_force_deals }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m flightseeker

      - name: Save results
        if: always() && (steps.search.outcome == 'success' || steps.search.outcome == 'failure')
        run: |
          git config user.name "Sean"
          git config user.email "265227563+zzz756424-byte@users.noreply.github.com"
          git add README.md data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update flight prices"
          git status --short
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Notify
        if: success() && hashFiles('out/deals.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat out/deals_title.txt)" --body-file out/deals.md

      - name: Push flight price alerts to LINE
        if: ${{ !cancelled() && hashFiles('out/line_deals.txt') != '' }}
        env:
          LINE_ALERTS_FILE: out/line_deals.txt
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m flightseeker.line_push
